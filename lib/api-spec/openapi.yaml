openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Digital Library SMAN 1 Bukittinggi API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: library
    description: Public library discovery and reservation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /books:
    get:
      operationId: listBooks
      tags: [library]
      summary: List books in the library catalog
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, available, borrowed]
            default: all
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [popular, newest]
            default: popular
      responses:
        "200":
          description: Matching catalog books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
  /books/{id}:
    get:
      operationId: getBook
      tags: [library]
      summary: Get a book detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /library-stats:
    get:
      operationId: getLibraryStats
      tags: [library]
      summary: Get public library summary counts
      responses:
        "200":
          description: Library summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStats"
  /magazines:
    get:
      operationId: listMagazines
      tags: [library]
      summary: List digital magazine editions
      responses:
        "200":
          description: Digital magazine editions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Magazine"
  /reservations:
    post:
      operationId: createReservation
      tags: [library]
      summary: Submit a book reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Book:
      type: object
      required:
        - id
        - title
        - author
        - category
        - ddc
        - isbn
        - publisher
        - year
        - language
        - synopsis
        - shelf
        - copies
        - availableCopies
        - coverUrl
        - status
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        category:
          type: string
        ddc:
          type: string
        isbn:
          type: string
        publisher:
          type: string
        year:
          type: integer
        language:
          type: string
        synopsis:
          type: string
        shelf:
          type: string
        copies:
          type: integer
        availableCopies:
          type: integer
        coverUrl:
          type: string
        status:
          type: string
          enum: [available, borrowed]
    LibraryStats:
      type: object
      required: [totalBooks, totalAuthors, totalCategories, availableBooks]
      properties:
        totalBooks:
          type: integer
        totalAuthors:
          type: integer
        totalCategories:
          type: integer
        availableBooks:
          type: integer
    Magazine:
      type: object
      required: [id, title, edition, year, coverUrl, description, readUrl]
      properties:
        id:
          type: integer
        title:
          type: string
        edition:
          type: string
        year:
          type: integer
        coverUrl:
          type: string
        description:
          type: string
        readUrl:
          type: string
    ReservationInput:
      type: object
      required: [bookId, name, nis, className]
      properties:
        bookId:
          type: integer
        name:
          type: string
          minLength: 2
        nis:
          type: string
          minLength: 3
        className:
          type: string
          minLength: 1
    Reservation:
      type: object
      required: [id, bookId, bookTitle, name, nis, className, status, createdAt]
      properties:
        id:
          type: integer
        bookId:
          type: integer
        bookTitle:
          type: string
        name:
          type: string
        nis:
          type: string
        className:
          type: string
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

